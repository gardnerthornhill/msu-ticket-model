name: spike-ticketdata
# Throwaway feasibility probe: can a GitHub runner read ticketdata.com at all?
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Plain HTTP probe
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for u in \
            "https://www.ticketdata.com/performer/mississippi-state-bulldogs-football" \
            "https://data.ticketdata.com/api/performers/mississippi-state-bulldogs-football/detailed"; do
            code=$(curl -sL -A "$UA" -H "Accept: text/html,application/json" -o /tmp/body -w '%{http_code}' "$u")
            echo "HTTP $code  $u"
            echo "  body starts: $(head -c 100 /tmp/body | tr '\n' ' ')"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright (stock Chromium, no stealth)
        run: |
          pip install -q playwright
          playwright install --with-deps chromium

      - name: Headless browser probe
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright

          URL = "https://www.ticketdata.com/performer/mississippi-state-bulldogs-football"
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_context(viewport={"width": 1280, "height": 900}).new_page()
              resp = page.goto(URL, wait_until="domcontentloaded", timeout=60000)
              print("navigation status:", resp.status if resp else None)
              rows = 0
              for i in range(13):
                  rows = page.locator("table tbody tr").count()
                  print(f"t+{i*5:>2}s  title={page.title()!r}  rows={rows}")
                  if rows:
                      break
                  page.wait_for_timeout(5000)
              if rows:
                  cells = page.locator("table tbody tr").nth(0).locator("td").all_inner_texts()
                  print("RESULT: TABLE VISIBLE; first row cells:", [c[:40] for c in cells])
              else:
                  print("RESULT: NO TABLE; body starts:", page.content()[:300].replace("\n", " "))
              browser.close()
          EOF
